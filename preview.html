/* ─── Reusable Pagination ─── */
function buildPages(cur,last,slots){
  if(last<=slots)return Array.from({length:last},(_,i)=>i+1);
  const side=Math.floor((slots-3)/2),out=[1];
  let s=Math.max(2,cur-side),e=Math.min(last-1,cur+side);
  if(cur-side<=2)e=slots-1; if(cur+side>=last-1)s=last-slots+2;
  if(s>2)out.push('…'); for(let i=s;i<=e;i++)out.push(i); if(e<last-1)out.push('…');
  out.push(last); return out;
}

 setup(){

  const sk=ref(''),sd=ref('asc');
  const all=ref([...MANY]);
  const cols=[['name',true,'Product'],['cat',true,'Category'],['price',true,'Price'],['stock',true,'Stock'],['status',false,'Status'],['',false,'']];

  const filtered=computed(()=>{let r=all.value.filter(p=>

          <div v-if="mode==='signin'" class="flex items-center justify-between text-sm">
            <label class="flex items-center gap-2 mut cursor-pointer"><input type="checkbox" checked class="rounded" :style="{accentColor:'var(--c-primary)'}"/>Remember me</label>

          <transition name="fade"><p v-if="err" class="flex items-start gap-2 text-sm px-3.5 py-2.5"

            <template v-if="mode==='signin'">Don't have an account?
              <button type="button" class="font-semibold" :style="{color:'var(--c-primary)'}" @click="go('register')">Create account</button></template>
            <template v-else>Already have an account?
              <button type="button" class="font-semibold" :style="{color:'var(--c-primary)'}" @click="go('signin')">Sign in</button></template></p>

            @click="f.email=a.email;f.pass='demo1234'">
            <span class="mut">{{a.email}}</span>
            <span class="text-[11px] font-bold" :style="{color:'var(--c-primary)'}">{{a.role}}</span></button></div></div>
    </div></section></div>`,
 setup(){
  const mode=ref('signin'),err=ref(''),busy=ref(false),show=ref(false),sent=ref('');
  const f=reactive({email:'admin@novapos.io',pass:'demo1234',name:'',store:'',code:''});
  const heads={signin:['Sign in','Welcome back. Please sign in to your terminal.'],
    register:['Create account','Start your 14-day free trial of NovaPOS.'],
    forgot:['Reset password','We will send a 6-digit verification code to your email.'],
    otp:['Verify code','Enter the 6-digit code we sent to your email.']};
  const btns={signin:'Sign in to NovaPOS',register:'Create account',forgot:'Send code',otp:'Verify code'};
  const go=m=>{err.value='';mode.value=m};
  const send=()=>{sent.value=String(Math.floor(100000+Math.random()*900000));toast('Demo OTP: '+sent.value)};
  const submit=()=>{
    err.value='';
    if(mode.value==='signin'){
      const acc=ACCOUNTS.find(a=>a.email===f.email.trim().toLowerCase());
      if(!acc)return err.value='No account found with that email address.';
      if(f.pass.length<4)return err.value='Password must be at least 4 characters.';
      busy.value=true;
      setTimeout(()=>{busy.value=false;auth.user=acc;toast('Welcome back, '+acc.name.split(' ')[0]+'!')},650);
    } else if(mode.value==='register'){
      if(!f.name.trim())return err.value='Please enter your full name.';
      if(!/^\\S+@\\S+\\.\\S+$/.test(f.email))return err.value='Please enter a valid email address.';
      if(f.pass.length<6)return err.value='Password must be at least 6 characters.';
      busy.value=true;
      setTimeout(()=>{busy.value=false;auth.user={name:f.name,email:f.email,role:'Owner'};toast('Account created')},650);
    } else if(mode.value==='forgot'){
      if(!/^\\S+@\\S+\\.\\S+$/.test(f.email))return err.value='Please enter a valid email address.';
      busy.value=true;
      setTimeout(()=>{busy.value=false;send();go('otp')},500);
    } else {
      if(f.code!==sent.value)return err.value='That code is incorrect.';
      busy.value=true;
      setTimeout(()=>{busy.value=false;toast('Password updated — please sign in');go('signin')},500);
    }};
  const mixc=(a,b,t)=>th(a,b,t);
  return{mode,err,busy,show,sent,f,heads,btns,go,send,submit,theme,dark:isDark,accounts:ACCOUNTS,mixc,
    feats:['Lightning-fast cashier workflow','Real-time inventory and stock alerts','Excel, CSV and PDF reporting','Multi-currency, tax and KHQR ready']}}};

              <input v-model="f.email" type="email" autocomplete="username" class="field pl-10 h-12" placeholder="you@store.com"/></div></div>

            <div v-if="['signin','register','reset'].includes(mode)">
              <label class="lbl">{{mode==='reset'?T.newPass:T.password}} <span style="color:var(--c-danger)">*</span></label>
              <div class="ig"><Icon n="lock" c="w-4 h-4 ic"/>
              <input v-model="f.pass" :type="show?'text':'password'" autocomplete="current-password" class="field pl-10 pr-11 h-12" placeholder="••••••••"/>
              <button type="button" class="ia" :class="show?'on':''" :aria-pressed="show" tabindex="-1"
                :aria-label="show?'Hide password':'Show password'" @click="show=!show">
                <Icon :n="show?'eyeOff':'eye'" c="w-[18px] h-[18px]"/></button></div></div>

            <div v-if="['register','reset'].includes(mode)"><label class="lbl">{{T.confirm}} <span style="color:var(--c-danger)">*</span></label>
              <div class="ig"><Icon n="lock" c="w-4 h-4 ic"/>
              <input v-model="f.confirm" :type="show2?'text':'password'" class="field pl-10 pr-11 h-12" placeholder="••••••••"/>
              <button type="button" class="ia" :class="show2?'on':''" :aria-pressed="show2" tabindex="-1" @click="show2=!show2">
                <Icon :n="show2?'eyeOff':'eye'" c="w-[18px] h-[18px]"/></button></div></div>

            <template v-if="mode==='otp'">
              <div><label class="lbl">{{T.otp}}</label>
                <input v-model="f.code" maxlength="6" inputmode="numeric" class="field h-14 text-center text-[22px] font-bold tracking-[.45em]" placeholder="000000"/>
                <p v-if="sent" class="mt-2 text-xs mut">Demo code: <b class="hd font-mono">{{sent}}</b></p></div>
              <button type="button" class="text-[13px] font-semibold" :style="{color:'var(--c-primary)'}" @click="send">{{T.resend}}</button></template>

            <div v-if="mode==='signin'" class="flex items-center justify-between gap-3 text-[13px]">
              <label class="flex items-center gap-2 mut cursor-pointer"><input type="checkbox" checked class="rounded w-4 h-4" :style="{accentColor:'var(--c-primary)'}"/>{{T.remember}}</label>
              <button type="button" class="font-semibold" :style="{color:'var(--c-primary)'}" @click="go('forgot')">{{T.forgotLink}}</button></div>

            <transition enter-active-class="transition duration-200" enter-from-class="opacity-0 -translate-y-1">
              <p v-if="err" class="flex items-start gap-2 text-[13px] px-3 py-2.5" role="alert"
                :style="{background:'color-mix(in srgb,var(--c-danger) 12%,transparent)',color:'var(--c-danger)',borderRadius:'var(--rxl)'}">
                <Icon n="alert" c="w-4 h-4 shrink-0 mt-px"/>{{err}}</p></transition>

            <button type="submit" class="btn btn-p w-full h-12 text-[15px]" :disabled="busy">
              <svg v-if="busy" class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity=".25" stroke-width="3"/>
                <path d="M21 12a9 9 0 00-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
              {{busy?'…':cta}}</button></form>

          <p v-if="!['forgot','otp','reset'].includes(mode)" class="mt-5 text-center text-[13px] mut">
            <template v-if="mode==='signin'">{{T.noAccount}}
              <button class="font-semibold" :style="{color:'var(--c-primary)'}" @click="go('register')">{{T.register}}</button></template>
            <template v-else>{{T.haveAccount}}
              <button class="font-semibold" :style="{color:'var(--c-primary)'}" @click="go('signin')">{{T.signIn}}</button></template></p>

        <div v-if="mode==='signin'" class="mt-6">
          <div class="flex items-center gap-3 mb-3">
            <span class="h-px grow" :style="{background:'var(--c-border)'}"></span>
            <span class="text-[11px] font-semibold uppercase tracking-wider mut">{{T.demo}}</span>
            <span class="h-px grow" :style="{background:'var(--c-border)'}"></span></div>
          <div class="flex flex-wrap justify-center gap-2">
            <button v-for="a in accounts" :key="a.email" type="button"
              class="inline-flex items-center gap-1.5 px-3 h-8 text-[12px] font-semibold border bd transition"
              :style="{borderRadius:'var(--rxl)',color:'var(--c-text)',background:'var(--c-card)'}"
              @click="f.email=a.email;f.pass='demo1234'">
              <span class="w-1.5 h-1.5 rounded-full" :style="{background:'var(--c-primary)'}"></span>{{a.role}}</button></div></div>
      </div></div>

    <footer class="shrink-0 px-5 sm:px-8 py-3 text-center"><p class="text-[11px] mut">© 2026 NovaPOS Systems</p></footer>
  </main></div>`,
 setup(){
  const mode=ref('signin'),err=ref(''),busy=ref(false),show=ref(false),show2=ref(false),sent=ref('');
  const f=reactive({email:'admin@novapos.io',pass:'demo1234',name:'',store:'',confirm:'',code:''});
  const head=computed(()=>({signin:[T.value.signIn,T.value.signInSub],register:[T.value.register,T.value.registerSub],
    forgot:[T.value.forgot,T.value.forgotSub],otp:[T.value.otp,T.value.otpSub],reset:[T.value.newPass,T.value.forgotSub]})[mode.value]);
  const cta=computed(()=>({signin:T.value.signIn,register:T.value.register,forgot:T.value.sendCode,
    otp:T.value.verify,reset:T.value.save})[mode.value]);
  const go=m=>{err.value='';mode.value=m};
  const send=()=>{sent.value=String(Math.floor(100000+Math.random()*900000));toast('Demo code: '+sent.value)};
  const submit=()=>{err.value='';
    if(mode.value==='signin'){
      const a=ACCOUNTS.find(x=>x.email===f.email.trim().toLowerCase());
      if(!a)return err.value='No account found with that email address.';
      if(f.pass.length<4)return err.value='Password must be at least 4 characters.';
      busy.value=true;setTimeout(()=>{busy.value=false;auth.user=a;toast('Welcome back, '+a.name.split(' ')[0]+'!')},600);
    }else if(mode.value==='register'){
      if(!f.name.trim())return err.value='Please enter your full name.';
      if(f.pass.length<6)return err.value='Password must be at least 6 characters.';
      if(f.pass!==f.confirm)return err.value='Passwords do not match.';
      busy.value=true;setTimeout(()=>{busy.value=false;auth.user={name:f.name,email:f.email,role:'Owner'};toast('Account created')},600);
    }else if(mode.value==='forgot'){
      if(!/^\\S+@\\S+\\.\\S+$/.test(f.email))return err.value='Please enter a valid email address.';
      busy.value=true;setTimeout(()=>{busy.value=false;send();go('otp')},450);
    }else if(mode.value==='otp'){
      if(f.code!==sent.value)return err.value='That code is incorrect.';
      go('reset');
    }else{
      if(f.pass.length<6)return err.value='Password must be at least 6 characters.';
      if(f.pass!==f.confirm)return err.value='Passwords do not match.';
      busy.value=true;setTimeout(()=>{busy.value=false;toast('Password updated');go('signin')},450)}};
  return{mode,err,busy,show,show2,sent,f,head,cta,go,send,submit,theme,dark:isDark,accounts:ACCOUNTS,T}}};

/* ════════════ ROOT : auth gate ════════════ */
const Root={components:{Login,App},
 template:`<transition name="fade" mode="out-in">
   <Login v-if="!auth.user" key="login"/>
   <App v-else key="app"/>
 </transition>`,
 setup(){
   const mq=window.matchMedia('(prefers-color-scheme: dark)');
   theme.sysDark=mq.matches; mq.addEventListener('change',e=>theme.sysDark=e.matches);
   applyTheme();
   return{auth}}};

const app=createApp(Root);
app.component('Pagination',Pagination);
app.component('FilterPanel',FilterPanel);
app.component('Confirm',Confirm);
app.component('Badge',Badge);
app.component('Icon',Icon);
app.component('LangSwitch',LangSwitch);
app.mount('#app');
</script>
</body>
</html>
